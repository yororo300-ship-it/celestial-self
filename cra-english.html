<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRA English Simulator</title>
<meta name="description" content="臨床開発モニター（CRA）向け英会話シミュレーター。AI role-play practice for CRAs talking to clinical trial investigators.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --surface-2: #eef2f7;
  --text: #1c2430;
  --muted: #5b6878;
  --border: #d9e0e8;
  --accent: #0f6cbd;
  --accent-soft: #e3effa;
  --accent-text: #ffffff;
  --doctor: #ffffff;
  --cra: #0f6cbd;
  --cra-text: #ffffff;
  --good: #1a7f4b;
  --good-soft: #e3f4ea;
  --warn: #a15c00;
  --warn-soft: #fdf1df;
  --bad: #b3261e;
  --shadow: 0 1px 3px rgba(20, 30, 50, .08), 0 4px 16px rgba(20, 30, 50, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151b;
    --surface: #1a2029;
    --surface-2: #232b36;
    --text: #e6ebf1;
    --muted: #9aa7b6;
    --border: #2f3946;
    --accent: #4ba3f0;
    --accent-soft: #1d3349;
    --accent-text: #0b1520;
    --doctor: #1f2731;
    --cra: #2e6fa8;
    --cra-text: #ffffff;
    --good: #5cc98d;
    --good-soft: #17301f;
    --warn: #f0b35a;
    --warn-soft: #33270f;
    --bad: #f08a83;
    --shadow: 0 1px 3px rgba(0, 0, 0, .4);
  }
}
:root[data-theme="dark"] {
  --bg: #11151b;
  --surface: #1a2029;
  --surface-2: #232b36;
  --text: #e6ebf1;
  --muted: #9aa7b6;
  --border: #2f3946;
  --accent: #4ba3f0;
  --accent-soft: #1d3349;
  --accent-text: #0b1520;
  --doctor: #1f2731;
  --cra: #2e6fa8;
  --cra-text: #ffffff;
  --good: #5cc98d;
  --good-soft: #17301f;
  --warn: #f0b35a;
  --warn-soft: #33270f;
  --bad: #f08a83;
  --shadow: 0 1px 3px rgba(0, 0, 0, .4);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
}
button { font: inherit; cursor: pointer; }
button:disabled { opacity: .5; cursor: not-allowed; }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
header.top {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 5;
}
header.top .wrap { display: flex; align-items: center; gap: 12px; height: 56px; }
header.top h1 { font-size: 16px; margin: 0; font-weight: 700; flex: 1; }
header.top h1 small { color: var(--muted); font-weight: 500; margin-left: 6px; font-size: 12px; }
.icon-btn {
  background: none; border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; height: 34px; min-width: 34px; padding: 0 10px; font-size: 13px;
}
.icon-btn:hover { background: var(--surface-2); }

.view { display: none; }
.view.active { display: block; }

/* Setup */
.intro { padding: 28px 0 8px; }
.intro h2 { font-size: 22px; margin: 0 0 6px; }
.intro p { margin: 0; color: var(--muted); }
.section-title { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em; margin: 24px 0 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.card {
  text-align: left; background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 12px; padding: 14px; color: var(--text); box-shadow: var(--shadow);
}
.card:hover { border-color: var(--accent); }
.card.selected { border-color: var(--accent); background: var(--accent-soft); }
.card .tag { font-size: 11px; font-weight: 600; color: var(--accent); }
.card .name { font-weight: 700; margin: 2px 0 4px; }
.card .desc { font-size: 13px; color: var(--muted); }
.custom-box { display: none; margin-top: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.custom-box.show { display: block; }
.custom-box label { display: block; font-size: 13px; font-weight: 600; margin: 8px 0 4px; }
textarea, input[type=text], select {
  width: 100%; font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
}
textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button {
  background: var(--surface); color: var(--text); border: 1.5px solid var(--border);
  border-radius: 999px; padding: 6px 14px; font-size: 14px;
}
.seg button.selected { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.seg-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; }
.opts label { display: flex; gap: 6px; align-items: center; font-size: 14px; }
.primary {
  background: var(--accent); color: var(--accent-text); border: none; border-radius: 10px;
  padding: 12px 22px; font-weight: 700; font-size: 15px;
}
.primary:hover { filter: brightness(1.08); }
.secondary {
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px;
}
.secondary:hover { background: var(--surface-2); }
.start-row { margin: 28px 0 40px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.start-row .err { color: var(--bad); font-size: 13px; }

/* Chat */
#chat-view.active { display: flex; flex-direction: column; height: calc(100dvh - 56px); }
.brief { background: var(--surface); border-bottom: 1px solid var(--border); }
.brief details { padding: 10px 0; }
.brief summary { cursor: pointer; font-weight: 600; font-size: 14px; }
.brief .goal { font-size: 13px; margin-top: 6px; }
.brief .goal b { color: var(--accent); }
.messages { flex: 1; overflow-y: auto; padding: 16px 0; }
.msg { display: flex; margin: 10px 0; flex-direction: column; }
.msg .who { font-size: 11px; color: var(--muted); margin: 0 4px 3px; }
.bubble { max-width: 85%; padding: 10px 14px; border-radius: 14px; word-wrap: break-word; white-space: pre-wrap; }
.msg.doctor { align-items: flex-start; }
.msg.doctor .bubble { background: var(--doctor); border: 1px solid var(--border); border-bottom-left-radius: 4px; box-shadow: var(--shadow); }
.msg.cra { align-items: flex-end; }
.msg.cra .bubble { background: var(--cra); color: var(--cra-text); border-bottom-right-radius: 4px; }
.bubble-tools { display: flex; gap: 6px; margin-top: 4px; }
.mini { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; font-size: 12px; padding: 1px 8px; }
.mini:hover { color: var(--text); background: var(--surface-2); }
.ja { font-size: 13px; color: var(--muted); margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); white-space: pre-wrap; }
.ja.hidden { display: none; }

.feedback {
  max-width: 85%; align-self: flex-end; margin-top: 6px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: 13px; box-shadow: var(--shadow);
}
.feedback .fb-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 4px; }
.stars { color: var(--warn); letter-spacing: 1px; }
.fb-row { margin-top: 6px; }
.fb-label { font-size: 11px; font-weight: 700; color: var(--muted); }
.fb-en { font-family: 'Inter', sans-serif; }
.fb-better { background: var(--good-soft); border-radius: 8px; padding: 6px 8px; margin-top: 2px; display: flex; gap: 6px; align-items: flex-start; justify-content: space-between; }
.fb-gcp { background: var(--warn-soft); color: var(--text); border-radius: 8px; padding: 6px 8px; margin-top: 6px; }
.fb-gcp b { color: var(--warn); }
.feedback.collapsed .fb-body { display: none; }

.typing { color: var(--muted); font-size: 13px; padding: 4px; }
.typing span { animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

.helper-panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 10px 12px; margin: 10px 0; font-size: 13px; box-shadow: var(--shadow);
}
.helper-panel h4 { margin: 0 0 6px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.sugg { padding: 8px; border-radius: 8px; background: var(--surface-2); margin-top: 6px; }
.sugg .en { font-weight: 600; }
.sugg .meta { color: var(--muted); font-size: 12px; }
.sugg .act { display: flex; gap: 6px; margin-top: 4px; }

.composer { background: var(--surface); border-top: 1px solid var(--border); padding: 10px 0 12px; }
.composer .row { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { resize: none; min-height: 44px; max-height: 140px; }
.send { height: 44px; padding: 0 18px; white-space: nowrap; flex-shrink: 0; }
.mic { height: 44px; width: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 18px; flex-shrink: 0; }
.mic.on { background: var(--bad); color: #fff; border-color: var(--bad); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .7; } }
.tools { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.tools .secondary { padding: 5px 10px; font-size: 13px; }
.tools .end { margin-left: auto; color: var(--bad); }
.status { font-size: 12px; color: var(--bad); min-height: 0; }

/* Result */
.result { padding: 24px 0 48px; }
.result h2 { margin: 0 0 4px; font-size: 22px; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; }
.badge.ok { background: var(--good-soft); color: var(--good); }
.badge.ng { background: var(--warn-soft); color: var(--warn); }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-top: 14px; box-shadow: var(--shadow); }
.panel h3 { margin: 0 0 10px; font-size: 15px; }
.score-row { display: grid; grid-template-columns: 140px 1fr 40px; gap: 10px; align-items: center; margin: 8px 0; font-size: 14px; }
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); border-radius: 999px; }
.panel ul { margin: 0; padding-left: 20px; }
.panel li { margin: 4px 0; }
.phrase { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.phrase:last-child { border-bottom: none; }
.phrase .en { font-weight: 600; }
.phrase .ja2 { font-size: 13px; color: var(--muted); }
.result-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.loading-full { text-align: center; padding: 60px 0; color: var(--muted); }

@media (max-width: 560px) {
  .bubble, .feedback { max-width: 95%; }
  .score-row { grid-template-columns: 100px 1fr 34px; font-size: 13px; }
  header.top h1 small { display: none; }
}
.mode-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.terms { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; max-width: 85%; }
.term {
  background: var(--accent-soft); color: var(--text); border: 1px solid transparent;
  border-radius: 8px; font-size: 12px; padding: 3px 8px; text-align: left;
}
.term b { color: var(--accent); margin-right: 4px; }
.term:hover { border-color: var(--accent); }
.explain-out p { margin: 6px 0; }
@media (max-width: 560px) {
  .terms { max-width: 95%; }
}
</style>

</head>
<body>

<header class="top">
  <div class="wrap">
    <h1>CRA English Simulator <small data-t="subtitle"></small></h1>
    <button class="icon-btn" id="theme-btn" aria-label="Theme">◐</button>
    <button class="icon-btn" id="home-btn" style="display:none" data-t="homeBtn"></button>
  </div>
</header>

<!-- Setup -->
<section id="setup-view" class="view active">
  <div class="wrap">
    <div class="intro">
      <h2 data-t="introTitle"></h2>
      <p data-t="introText"></p>
    </div>

    <div class="section-title" data-t="secMode"></div>
    <div class="mode-cards" id="mode-cards">
      <button class="card" data-v="ja">
        <div class="tag">日本語サポート</div>
        <div class="name">英語を練習したい人向け</div>
        <div class="desc">添削・和訳・解説はすべて日本語。文法や自然な言い回しまでチェックします。</div>
      </button>
      <button class="card" data-v="en">
        <div class="tag">English support</div>
        <div class="name">New to clinical research?</div>
        <div class="desc">Everything in English. Focus on clinical-trial terminology, GCP and how to talk to investigators. Jargon is explained in plain English.</div>
      </button>
    </div>

    <div class="section-title" data-t="secScenario"></div>
    <div class="cards" id="scenario-cards"></div>
    <div class="custom-box" id="custom-box">
      <label for="c-situation" data-t="cSituation"></label>
      <textarea id="c-situation" rows="3"></textarea>
      <label for="c-goal" data-t="cGoal"></label>
      <textarea id="c-goal" rows="2"></textarea>
      <label for="c-role" data-t="cRole"></label>
      <input type="text" id="c-role">
    </div>

    <div class="section-title" data-t="secDifficulty"></div>
    <div class="seg" id="difficulty-seg">
      <button data-v="beginner" data-t="diffBeginner"></button>
      <button data-v="intermediate" data-t="diffIntermediate" class="selected"></button>
      <button data-v="advanced" data-t="diffAdvanced"></button>
    </div>
    <div class="seg-note" id="difficulty-note"></div>

    <div class="section-title" data-t="secRegion"></div>
    <div class="seg" id="region-seg">
      <button data-v="us" class="selected" data-t="rUs"></button>
      <button data-v="uk" data-t="rUk"></button>
      <button data-v="de" data-t="rDe"></button>
      <button data-v="in" data-t="rIn"></button>
      <button data-v="au" data-t="rAu"></button>
      <button data-v="sg" data-t="rSg"></button>
    </div>
    <div class="seg-note" data-t="regionNote"></div>

    <div class="section-title" data-t="secOptions"></div>
    <div class="opts">
      <label><input type="checkbox" id="opt-tts" checked> <span data-t="optTts"></span></label>
      <label><input type="checkbox" id="opt-gloss"> <span data-t="optGloss"></span></label>
      <label><span data-t="optRate"></span>
        <select id="opt-rate" style="width:auto">
          <option value="0.75" data-t="rateSlow"></option>
          <option value="0.9" data-t="rateNormal" selected></option>
          <option value="1.05" data-t="rateFast"></option>
        </select>
      </label>
    </div>

    <div class="start-row">
      <button class="primary" id="start-btn" data-t="startBtn"></button>
      <span class="err" id="setup-err"></span>
    </div>
  </div>
</section>

<!-- Chat -->
<section id="chat-view" class="view">
  <div class="brief">
    <div class="wrap">
      <details id="brief-details" open>
        <summary id="brief-title"></summary>
        <div class="goal" id="brief-situation"></div>
        <div class="goal"><b data-t="goalLabel"></b><span id="brief-goal"></span></div>
      </details>
    </div>
  </div>
  <div class="messages" id="messages">
    <div class="wrap" id="messages-inner"></div>
  </div>
  <div class="composer">
    <div class="wrap">
      <div class="tools">
        <button class="secondary" id="hint-btn" data-t="hintBtn"></button>
        <button class="secondary" id="tr-btn" data-t="trBtn"></button>
        <button class="secondary" id="explain-btn" data-t="explainBtn"></button>
        <button class="secondary end" id="end-btn" data-t="endBtn"></button>
      </div>
      <div class="row">
        <button class="mic" id="mic-btn" aria-label="Voice input">🎤</button>
        <textarea id="input" rows="1"></textarea>
        <button class="primary send" id="send-btn" data-t="sendBtn"></button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>
</section>

<!-- Result -->
<section id="result-view" class="view">
  <div class="wrap result" id="result-inner"></div>
</section>

  const REGION_LANG = { us: 'en-US', uk: 'en-GB', de: 'en-GB', in: 'en-IN', au: 'en-AU', sg: 'en-SG' };

  // ---------- state ----------
  const state = {
    lang: 'ja',
    scenarioId: null,
    difficulty: 'intermediate',
    region: 'us',
    history: [],
    busy: false,
    scenario: null
  };

  const $ = id => document.getElementById(id);
  const T = key => STR[state.lang][key];
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // ---------- storage (per-viewer convenience only) ----------
  function load(key, fallback) {
    try { const v = localStorage.getItem('cra-en:' + key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem('cra-en:' + key, JSON.stringify(value)); } catch (e) { /* ignore */ }
  }

  // ---------- theme ----------
  const savedTheme = load('theme', null);
  if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  $('theme-btn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    save('theme', next);
  });

  // ---------- language / mode ----------
  function applyLang() {
    document.documentElement.lang = state.lang;
    document.querySelectorAll('[data-t]').forEach(n => { n.textContent = T(n.dataset.t); });
    $('c-situation').placeholder = T('cSituationPh');
    $('c-goal').placeholder = T('cGoalPh');
    $('c-role').placeholder = T('cRolePh');
    $('input').placeholder = T('inputPh');
    $('difficulty-note').textContent = T('diffNote')[state.difficulty];
    $('tr-btn').style.display = state.lang === 'ja' ? '' : 'none';
    document.querySelectorAll('#mode-cards .card').forEach(c => c.classList.toggle('selected', c.dataset.v === state.lang));
    if (!SR) $('mic-btn').title = T('micUnsupported');
    renderScenarioCards();
  }
  document.querySelectorAll('#mode-cards .card').forEach(c => {
    c.addEventListener('click', () => {
      state.lang = c.dataset.v;
      save('lang', state.lang);
      applyLang();
    });
  });

  // ---------- setup ----------
  function renderScenarioCards() {
    const wrap = $('scenario-cards');
    wrap.textContent = '';
    SCENARIOS.forEach(s => {
      const b = el('button', 'card' + (s.id === state.scenarioId ? ' selected' : ''));
      b.dataset.id = s.id;
      b.appendChild(el('div', 'tag', s.tag));
      b.appendChild(el('div', 'name', s.name[state.lang]));
      b.appendChild(el('div', 'desc', s.desc[state.lang]));
      b.addEventListener('click', () => selectScenario(s.id));
      wrap.appendChild(b);
    });
  }
  function selectScenario(id) {
    state.scenarioId = id;
    document.querySelectorAll('#scenario-cards .card').forEach(c => c.classList.toggle('selected', c.dataset.id === id));
    $('custom-box').classList.toggle('show', id === 'custom');
    $('setup-err').textContent = '';
  }
  function bindSeg(segId, key, onChange) {
    const seg = $(segId);
    seg.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', () => {
        seg.querySelectorAll('button').forEach(x => x.classList.toggle('selected', x === b));
        state[key] = b.dataset.v;
        if (onChange) onChange(b.dataset.v);
      });
    });
  }
  bindSeg('difficulty-seg', 'difficulty', v => {
    $('difficulty-note').textContent = T('diffNote')[v];
    $('opt-rate').value = v === 'beginner' ? '0.75' : v === 'advanced' ? '1.05' : '0.9';
  });
  bindSeg('region-seg', 'region');

  ['opt-tts', 'opt-gloss'].forEach(id => {
    const v = load(id, null);
    if (v !== null) $(id).checked = v;
    $(id).addEventListener('change', () => save(id, $(id).checked));
  });

  function buildScenario() {
    const base = SCENARIOS.find(s => s.id === state.scenarioId);
    if (!base) return null;
    const s = Object.assign({}, base, { difficulty: state.difficulty, region: state.region });
    if (base.id === 'custom') {
      s.situation = $('c-situation').value.trim();
      s.goal = $('c-goal').value.trim();
      s.doctorRole = $('c-role').value.trim() || 'principal investigator';
      s.hidden = 'Decide a realistic stance yourself that makes the conversation challenging but solvable.';
      if (!s.situation || !s.goal) return null;
    }
    return s;
  }

  // ---------- views ----------
  function show(view) {
    ['setup-view', 'chat-view', 'result-view'].forEach(v => $(v).classList.toggle('active', v === view));
    $('home-btn').style.display = view === 'setup-view' ? 'none' : '';
    window.scrollTo(0, 0);
  }
  $('home-btn').addEventListener('click', () => {
    if (state.history.length && $('chat-view').classList.contains('active') && !confirm(T('confirmLeave'))) return;
    stopSpeaking();
    stopMic();
    show('setup-view');
  });

  // ---------- API ----------
  async function call(action, extra) {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({
        action,
        lang: state.lang,
        scenario: state.scenario,
        history: state.history
      }, extra || {}))
    });
    let data = null;
    try { data = await res.json(); } catch (e) { /* ignore */ }
    if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
    return data;
  }

  // ---------- speech: TTS ----------
  let voices = [];
  function refreshVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
  if (window.speechSynthesis) {
    refreshVoices();
    speechSynthesis.onvoiceschanged = refreshVoices;
  }
  function pickVoice(lang) {
    const en = voices.filter(v => /^en/i.test(v.lang));
    const norm = l => l.replace('_', '-').toLowerCase();
    return en.find(v => norm(v.lang) === lang.toLowerCase())
      || en.find(v => norm(v.lang).startsWith('en-us'))
      || en[0] || null;
  }
  function speak(text) {
    if (!window.speechSynthesis || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const lang = REGION_LANG[state.region] || 'en-US';
    const v = pickVoice(lang);
    if (v) u.voice = v;
    u.lang = v ? v.lang : lang;
    u.rate = parseFloat($('opt-rate').value) || 0.9;
    speechSynthesis.speak(u);
  }
  function stopSpeaking() { if (window.speechSynthesis) speechSynthesis.cancel(); }

  // ---------- speech: recognition ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null;
  let recBase = '';
  if (!SR) $('mic-btn').disabled = true;
  function startMic() {
    if (!SR) return;
    stopSpeaking();
    rec = new SR();
    rec.lang = 'en-US';
    rec.interimResults = true;
    rec.continuous = true;
    recBase = $('input').value ? $('input').value.replace(/\s*$/, ' ') : '';
    rec.onresult = e => {
      let finalText = '', interim = '';
      for (let i = 0; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      $('input').value = recBase + finalText + interim;
      autoGrow();
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed') setStatus(T('micDenied'));
      stopMic();
    };
    rec.onend = () => { $('mic-btn').classList.remove('on'); rec = null; };
    rec.start();
    $('mic-btn').classList.add('on');
  }
  function stopMic() {
    if (rec) { try { rec.stop(); } catch (e) { /* ignore */ } }
    $('mic-btn').classList.remove('on');
  }
  $('mic-btn').addEventListener('click', () => { rec ? stopMic() : startMic(); });

  // ---------- chat rendering ----------
  const inner = $('messages-inner');
  function scrollBottom() { const m = $('messages'); m.scrollTop = m.scrollHeight; }
  function setStatus(t) { $('status').textContent = t || ''; }

  function addDoctor(r) {
    const m = el('div', 'msg doctor');
    m.appendChild(el('div', 'who', 'Dr. ' + state.scenario.doctorName));
    const b = el('div', 'bubble', r.reply);
    const glossEl = el('div', 'ja' + ($('opt-gloss').checked ? '' : ' hidden'), r.gloss || '');
    b.appendChild(glossEl);
    m.appendChild(b);
    const tools = el('div', 'bubble-tools');
    const play = el('button', 'mini', T('play'));
    play.addEventListener('click', () => speak(r.reply));
    const gl = el('button', 'mini', T('glossBtn'));
    gl.addEventListener('click', () => glossEl.classList.toggle('hidden'));
    tools.appendChild(play);
    tools.appendChild(gl);
    m.appendChild(tools);
    if (r.terms && r.terms.length) {
      const terms = el('div', 'terms');
      r.terms.forEach(t => {
        const chip = el('button', 'term');
        chip.appendChild(el('b', '', t.term));
        chip.appendChild(document.createTextNode(t.meaning));
        chip.title = T('exGo');
        chip.addEventListener('click', () => openExplain(t.term));
        terms.appendChild(chip);
      });
      m.appendChild(terms);
    }
    inner.appendChild(m);
    scrollBottom();
    if ($('opt-tts').checked) speak(r.reply);
  }

  function addCra(text) {
    const m = el('div', 'msg cra');
    m.appendChild(el('div', 'who', T('you')));
    m.appendChild(el('div', 'bubble', text));
    inner.appendChild(m);
    scrollBottom();
    return m;
  }

  function stars(n) {
    n = Math.max(1, Math.min(5, Math.round(n || 0)));
    return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n);
  }

  function addFeedback(msgEl, original, fb) {
    if (!fb) return;
    const box = el('div', 'feedback');
    const head = el('div', 'fb-head');
    head.appendChild(el('span', '', T('fbTitle')));
    const right = el('span');
    right.appendChild(el('span', 'stars', stars(fb.score)));
    const tog = el('button', 'mini', T('fbClose'));
    tog.style.marginLeft = '8px';
    tog.addEventListener('click', () => {
      box.classList.toggle('collapsed');
      tog.textContent = box.classList.contains('collapsed') ? T('fbOpen') : T('fbClose');
    });
    right.appendChild(tog);
    head.appendChild(right);
    box.appendChild(head);

    const body = el('div', 'fb-body');
    const corrected = (fb.corrected || '').trim();
    if (corrected && corrected !== original.trim()) {
      const r = el('div', 'fb-row');
      r.appendChild(el('div', 'fb-label', T('fbCorrected')));
      r.appendChild(el('div', 'fb-en', corrected));
      body.appendChild(r);
    }
    if (fb.better) {
      const r = el('div', 'fb-row');
      r.appendChild(el('div', 'fb-label', T('fbBetter')));
      const bb = el('div', 'fb-better');
      bb.appendChild(el('span', 'fb-en', fb.better));
      const p = el('button', 'mini', '🔊');
      p.addEventListener('click', () => speak(fb.better));
      bb.appendChild(p);
      r.appendChild(bb);
      body.appendChild(r);
    }
    if (fb.comments) {
      const r = el('div', 'fb-row', fb.comments);
      r.style.whiteSpace = 'pre-wrap';
      body.appendChild(r);
    }
    if (fb.gcp_note) {
      const g = el('div', 'fb-gcp');
      g.appendChild(el('b', '', T('fbGcp')));
      g.appendChild(document.createTextNode(fb.gcp_note));
      body.appendChild(g);
    }
    box.appendChild(body);
    msgEl.appendChild(box);
    scrollBottom();
  }

  function showTyping() {
    const t = el('div', 'typing');
    t.id = 'typing';
    t.appendChild(document.createTextNode('Dr. ' + state.scenario.doctorName + T('typing')));
    for (let i = 0; i < 3; i++) t.appendChild(el('span', '', '●'));
    inner.appendChild(t);
    scrollBottom();
  }
  function hideTyping() { const t = $('typing'); if (t) t.remove(); }

  function setBusy(b) {
    state.busy = b;
    ['send-btn', 'hint-btn', 'tr-btn', 'explain-btn', 'end-btn'].forEach(id => { $(id).disabled = b; });
  }

  // ---------- flow ----------
  $('start-btn').addEventListener('click', async () => {
    if (!state.scenarioId) { $('setup-err').textContent = T('errScenario'); return; }
    const s = buildScenario();
    if (!s) { $('setup-err').textContent = T('errCustom'); return; }
    state.scenario = s;
    state.history = [];
    inner.textContent = '';
    setStatus('');
    $('brief-title').textContent = s.name[state.lang] + ' — Dr. ' + s.doctorName;
    $('brief-situation').textContent = s.id === 'custom' ? s.situation : s.desc[state.lang];
    $('brief-goal').textContent = state.lang === 'ja' && s.goalJa ? s.goalJa : s.goal;
    $('brief-details').open = true;
    show('chat-view');
    setBusy(true);
    showTyping();
    try {
      const r = await call('start');
      hideTyping();
      state.history.push({ role: 'doctor', text: r.reply });
      addDoctor(r);
      $('input').focus();
    } catch (e) {
      hideTyping();
      setStatus(T('startFail') + e.message);
    } finally {
      setBusy(false);
    }
  });

  async function send() {
    const text = $('input').value.trim();
    if (!text || state.busy) return;
    stopMic();
    stopSpeaking();
    closeHelper();
    $('input').value = '';
    autoGrow();
    $('brief-details').open = false;
    const msgEl = addCra(text);
    state.history.push({ role: 'cra', text });
    setBusy(true);
    setStatus('');
    showTyping();
    try {
      const r = await call('turn');
      hideTyping();
      addFeedback(msgEl, text, r.feedback);
      state.history.push({ role: 'doctor', text: r.reply });
      addDoctor(r);
    } catch (e) {
      hideTyping();
      state.history.pop();
      msgEl.remove();
      $('input').value = text;
      autoGrow();
      setStatus(T('sendFail') + e.message);
    } finally {
      setBusy(false);
    }
  }
  $('send-btn').addEventListener('click', send);
  $('input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  function autoGrow() {
    const t = $('input');
    t.style.height = 'auto';
    t.style.height = Math.min(t.scrollHeight, 140) + 'px';
  }
  $('input').addEventListener('input', autoGrow);

  // ---------- helpers: hint / translate / explain ----------
  function closeHelper() { const h = $('helper'); if (h) h.remove(); }
  function helperPanel(title) {
    closeHelper();
    const p = el('div', 'helper-panel');
    p.id = 'helper';
    const h = el('h4');
    h.appendChild(el('span', '', title));
    const x = el('button', 'mini', '×');
    x.addEventListener('click', closeHelper);
    h.appendChild(x);
    p.appendChild(h);
    inner.appendChild(p);
    scrollBottom();
    return p;
  }
  function suggestion(en, meaning, note) {
    const s = el('div', 'sugg');
    s.appendChild(el('div', 'en', en));
    if (meaning) s.appendChild(el('div', 'meta', meaning));
    if (note) s.appendChild(el('div', 'meta', '💬 ' + note));
    const act = el('div', 'act');
    const use = el('button', 'mini', T('toInput'));
    use.addEventListener('click', () => { $('input').value = en; autoGrow(); $('input').focus(); });
    const play = el('button', 'mini', '🔊');
    play.addEventListener('click', () => speak(en));
    act.appendChild(use);
    act.appendChild(play);
    s.appendChild(act);
    return s;
  }

  $('hint-btn').addEventListener('click', async () => {
    if (state.busy) return;
    const p = helperPanel(T('hintTitle'));
    const loading = el('div', 'meta', T('thinking'));
    p.appendChild(loading);
    setBusy(true);
    try {
      const r = await call('hint');
      loading.remove();
      (r.suggestions || []).forEach(s => p.appendChild(suggestion(s.en, s.meaning, s.note)));
      scrollBottom();
    } catch (e) {
      loading.textContent = T('fetchFail') + e.message;
    } finally {
      setBusy(false);
    }
  });

  // A small panel with a text box that calls `action` and renders the result.
  function inputPanel(opts) {
    if (state.busy) return;
    const p = helperPanel(opts.title);
    const ta = el('textarea');
    ta.rows = 2;
    ta.placeholder = opts.placeholder;
    ta.value = opts.initial || '';
    p.appendChild(ta);
    const go = el('button', 'secondary', opts.button);
    go.style.marginTop = '6px';
    const out = el('div', 'explain-out');
    p.appendChild(go);
    p.appendChild(out);
    ta.focus();
    async function run() {
      const text = ta.value.trim();
      if (!text || state.busy) return;
      out.textContent = '';
      const loading = el('div', 'meta', T('translating'));
      out.appendChild(loading);
      setBusy(true);
      go.disabled = true;
      try {
        const r = await call(opts.action, { text });
        loading.remove();
        opts.render(r, out);
        scrollBottom();
      } catch (e) {
        loading.textContent = opts.fail + e.message;
      } finally {
        setBusy(false);
        go.disabled = false;
      }
    }
    go.addEventListener('click', run);
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); run(); }
    });
    if (opts.autorun) run();
  }

  $('tr-btn').addEventListener('click', () => {
    const typed = $('input').value.trim();
    inputPanel({
      action: 'translate', title: T('trTitle'), placeholder: T('trPh'), button: T('trGo'), fail: T('trFail'),
      initial: /[぀-ヿ一-龯]/.test(typed) ? typed : '',
      render: (r, out) => (r.options || []).forEach(o => out.appendChild(suggestion(o.en, null, o.tone)))
    });
  });

  function openExplain(term) {
    inputPanel({
      action: 'explain', title: T('exTitle'), placeholder: T('exPh'), button: T('exGo'), fail: T('fetchFail'),
      initial: term || '', autorun: !!term,
      render: (r, out) => {
        out.appendChild(el('p', '', r.explanation));
        if (r.in_this_case) {
          const p = el('p');
          p.appendChild(el('b', '', T('exInCase')));
          p.appendChild(document.createTextNode(r.in_this_case));
          out.appendChild(p);
        }
        if (r.examples && r.examples.length) {
          out.appendChild(el('div', 'fb-label', T('exExamples')));
          r.examples.forEach(x => out.appendChild(suggestion(x, null, null)));
        }
        if (r.related && r.related.length) {
          out.appendChild(el('div', 'fb-label', T('exRelated')));
          const terms = el('div', 'terms');
          terms.style.maxWidth = '100%';
          r.related.forEach(t => {
            const chip = el('button', 'term');
            chip.appendChild(el('b', '', t.term));
            chip.appendChild(document.createTextNode(t.meaning));
            chip.addEventListener('click', () => openExplain(t.term));
            terms.appendChild(chip);
          });
          out.appendChild(terms);
        }
      }
    });
  }
  $('explain-btn').addEventListener('click', () => openExplain(''));

  // ---------- evaluation ----------
  $('end-btn').addEventListener('click', async () => {
    if (state.busy) return;
    if (!state.history.some(m => m.role === 'cra')) {
      setStatus(T('noTurn'));
      return;
    }
    stopMic();
    stopSpeaking();
    const out = $('result-inner');
    out.textContent = '';
    out.appendChild(el('div', 'loading-full', T('evaluating')));
    show('result-view');
    try {
      const r = await call('evaluate');
      renderResult(r);
    } catch (e) {
      out.textContent = '';
      out.appendChild(el('div', 'loading-full', T('evalFail') + e.message));
      const back = el('button', 'secondary', T('backToChat'));
      back.addEventListener('click', () => show('chat-view'));
      out.appendChild(back);
    }
  });

  function renderResult(r) {
    const out = $('result-inner');
    out.textContent = '';
    out.appendChild(el('h2', '', T('reportTitle')));
    const sub = el('div');
    sub.appendChild(el('span', 'badge ' + (r.goal_achieved ? 'ok' : 'ng'), r.goal_achieved ? T('goalOk') : T('goalNg')));
    sub.appendChild(document.createTextNode('  ' + state.scenario.name[state.lang]));
    out.appendChild(sub);

    const sp = el('div', 'panel');
    sp.appendChild(el('h3', '', T('scoresTitle')));
    const labels = T('scoreLabels');
    Object.keys(labels).forEach(k => {
      const v = Math.max(0, Math.min(10, Math.round((r.scores || {})[k] || 0)));
      const row = el('div', 'score-row');
      row.appendChild(el('span', '', labels[k]));
      const bar = el('div', 'bar');
      const fill = el('div');
      fill.style.width = (v * 10) + '%';
      bar.appendChild(fill);
      row.appendChild(bar);
      row.appendChild(el('b', '', String(v)));
      sp.appendChild(row);
    });
    if (r.summary) {
      const p = el('p', '', r.summary);
      p.style.marginBottom = '0';
      sp.appendChild(p);
    }
    out.appendChild(sp);

    function listPanel(title, items) {
      if (!items || !items.length) return;
      const p = el('div', 'panel');
      p.appendChild(el('h3', '', title));
      const ul = el('ul');
      items.forEach(i => ul.appendChild(el('li', '', i)));
      p.appendChild(ul);
      out.appendChild(p);
    }
    listPanel(T('strengths'), r.strengths);
    listPanel(T('improvements'), r.improvements);

    if (r.key_phrases && r.key_phrases.length) {
      const p = el('div', 'panel');
      p.appendChild(el('h3', '', T('phrases')));
      r.key_phrases.forEach(k => {
        const row = el('div', 'phrase');
        const left = el('div');
        left.appendChild(el('div', 'en', k.en));
        left.appendChild(el('div', 'ja2', k.meaning));
        row.appendChild(left);
        const play = el('button', 'mini', '🔊');
        play.addEventListener('click', () => speak(k.en));
        row.appendChild(play);
        p.appendChild(row);
      });
      out.appendChild(p);
    }

    const acts = el('div', 'result-actions');
    const again = el('button', 'primary', T('again'));
    again.addEventListener('click', () => $('start-btn').click());
    const back = el('button', 'secondary', T('viewLog'));
    back.addEventListener('click', () => show('chat-view'));
    const home = el('button', 'secondary', T('other'));
    home.addEventListener('click', () => show('setup-view'));
    acts.appendChild(again);
    acts.appendChild(back);
    acts.appendChild(home);
    out.appendChild(acts);
  }

  // ---------- init ----------
  const savedLang = load('lang', null);
  const params = new URLSearchParams(location.search);
  state.lang = STR[params.get('lang')] ? params.get('lang')
    : STR[savedLang] ? savedLang
    : (navigator.language || '').toLowerCase().startsWith('ja') ? 'ja' : 'en';
  applyLang();
})();
</script>
</body>
</html>
